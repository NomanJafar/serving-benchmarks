[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serving-benchmarks"
version = "0.1.0"
description = "Public, reproducible latency, throughput and cost benchmarks for three LLM serving configurations, with full methodology and raw data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/serving_benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
